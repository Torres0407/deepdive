apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: deepdive
  labels:
    app: deepdive-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deepdive-client
  template:
    metadata:
      labels:
        app: deepdive-client
    spec:
      containers:
        - name: client
          image: deepdive-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: deepdive
spec:
  type: LoadBalancer
  selector:
    app: deepdive-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
