server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for assets and frames
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/jpeg image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache frame images
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API calls to backend NestJS container
    location /scores {
        proxy_pass http://server:3000/scores;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
