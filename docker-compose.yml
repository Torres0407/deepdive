services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: deepdive-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - server-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/scores"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepdive-client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
    driver: local
