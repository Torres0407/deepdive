apiVersion: v1
kind: Namespace
metadata:
  name: deepdive
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
  namespace: deepdive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: deepdive
  labels:
    app: deepdive-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepdive-server
  template:
    metadata:
      labels:
        app: deepdive-server
    spec:
      containers:
        - name: server
          image: deepdive-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /scores
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /scores
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: deepdive
spec:
  type: ClusterIP
  selector:
    app: deepdive-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
